name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npx vitest run src/crypto
        working-directory: client
      - run: mkdir -p server/static && cp -a client/dist server/static/dist
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: server/static/dist/
          if-no-files-found: error
          retention-days: 1

  backend:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment script syntax
        run: |
          bash -n deploy/domestic-deploy.sh
          bash -n deploy/prepare-offline-bundle.sh
          bash -n deploy/offline-install.sh
          bash -n deploy/package-offline-release.sh
      - name: Ensure production deployment is manual only
        run: |
          grep -Eq '^[[:space:]]+workflow_dispatch:' .github/workflows/deploy.yml
          if grep -Eq '^[[:space:]]+push:' .github/workflows/deploy.yml; then
            echo "Automatic push deployment must remain disabled." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: server/static/dist/
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: server/go.sum
      - run: go test ./...
        working-directory: server
