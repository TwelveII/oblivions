name: Deploy MQVI to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mqvi-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build frontend
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Embed frontend and build server
        working-directory: server
        run: |
          rm -rf static/dist
          mkdir -p static/dist
          cp -a ../client/dist/. static/dist/
          go build -trimpath -o "$GITHUB_WORKSPACE/mqvi-server.new" .

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Upload release binary
        run: |
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$GITHUB_WORKSPACE/mqvi-server.new" \
            root@185.249.9.132:/tmp/mqvi-server.new

      - name: Deploy with backup and automatic rollback
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            root@185.249.9.132 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          APP=/opt/mqvi
          SERVICE=mqvi-server.service
          NEW=/tmp/mqvi-server.new
          CURRENT="$APP/mqvi-server"
          BACKUPS="$APP/deploy-backups"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="$BACKUPS/mqvi-server-$STAMP"

          test -s "$NEW"
          test -x "$CURRENT"
          install -d -o root -g root -m 700 "$BACKUPS"
          cp -a "$CURRENT" "$BACKUP"
          install -o root -g root -m 755 "$NEW" "$APP/mqvi-server.installing"
          mv -f "$APP/mqvi-server.installing" "$CURRENT"
          rm -f "$NEW"

          if ! systemctl restart "$SERVICE"; then
            cp -a "$BACKUP" "$APP/mqvi-server.rollback"
            mv -f "$APP/mqvi-server.rollback" "$CURRENT"
            systemctl restart "$SERVICE" || true
            exit 1
          fi

          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 \
              http://127.0.0.1:9091/health/ready >/dev/null; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Readiness check failed; rolling back to $BACKUP" >&2
            cp -a "$BACKUP" "$APP/mqvi-server.rollback"
            mv -f "$APP/mqvi-server.rollback" "$CURRENT"
            systemctl restart "$SERVICE" || true
            exit 1
          fi

          echo "Deployment succeeded; backup: $BACKUP"
          REMOTE
