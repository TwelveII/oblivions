<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/oblivions-icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="256x256" href="/oblivions-icon-256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <title>Oblivions</title>
    <!-- Keep the pre-React loader visually identical to the React boot state. -->
    <style>
      :root { color-scheme: dark; }
      html, body { width:100%; min-height:100%; margin:0; padding:0; background:#0b0d10; color:#edf1f5; }
      #root { min-height:100vh; min-height:100svh; }
      .app-loading {
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        width:100%; min-height:100vh; min-height:100svh; gap:16px;
        box-sizing:border-box; padding:24px;
        background:radial-gradient(ellipse at 50% 0%,rgba(112,132,157,.13),transparent 55%),#0b0d10;
        color:#edf1f5;
        font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        letter-spacing:-.012em;
      }
      .app-loading-logo { display:block; width:72px; height:72px; object-fit:contain; }
      .app-loading-spinner {
        width:28px; height:28px; box-sizing:border-box;
        border:3px solid rgba(220,231,244,.10); border-top-color:#a8b7c9;
        border-radius:50%; animation:oblivions-boot-spin .7s linear infinite;
      }
      @keyframes oblivions-boot-spin { to { transform:rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .app-loading-spinner { animation-duration:1.8s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Same markup and Obsidian tokens as App.tsx while React initializes. -->
      <div class="app-loading">
        <img src="/oblivions-icon-128.png" alt="" class="app-loading-logo" />
        <div class="app-loading-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
